id: nfip_claims_ingestion
namespace: nfip
description: |
  Monthly snapshot of FEMA's NFIP Redacted Claims (v3) dataset.

  The full-file download on fema.gov only serves real browsers (403 for scripts),
  so the data is pulled from the official OpenFEMA API instead, in Parquet pages:
    1. extract: query the record count, download every page (Parquet) using keyset pagination
       (id > last id) instead of $skip, merge them with DuckDB and check the result is complete
       and free of duplicate ids. Records the API can't serve as Parquet are isolated by shrinking
       the page size and fetched as JSON instead.
    2. upload_to_gcs: store the snapshot in the data lake, partitioned by snapshot date
    3. load_to_bigquery: load it into nfip_raw.claims, replacing the previous snapshot

inputs:
  - id: api_url
    type: STRING
    defaults: https://www.fema.gov/api/open/v3/NfipClaims

  - id: page_size
    type: INT
    defaults: 10000

  # Test mode: download only a slice of the data. GCS upload and BigQuery load are skipped.
  - id: start_after_id
    type: INT
    required: false
    description: "Test mode: start downloading after this id"

  - id: max_records
    type: INT
    defaults: 0
    description: "Test mode: stop after this many records (0 = full download)"

variables:
  snapshot_date: "{{ (trigger.date ?? execution.startDate) | date('yyyy-MM-dd') }}"
  gcs_uri: "gs://{{ envs.bucket_name }}/raw/claims/snapshot_date={{ render(vars.snapshot_date) }}/claims.parquet"

tasks:
  - id: extract
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet --disable-pip-version-check requests==2.32.3 duckdb==1.1.3
    env:
      API_URL: "{{ inputs.api_url }}"
      PAGE_SIZE: "{{ inputs.page_size }}"
      START_AFTER_ID: "{{ inputs.start_after_id ?? '' }}"
      MAX_RECORDS: "{{ inputs.max_records }}"
    outputFiles:
      - claims.parquet
    timeout: PT2H
    script: |
      import json
      import os
      import pathlib
      import time

      import duckdb
      import requests

      API_URL = os.environ["API_URL"]
      PAGE_SIZE = int(os.environ["PAGE_SIZE"])
      START_AFTER_ID = int(os.environ["START_AFTER_ID"]) if os.environ.get("START_AFTER_ID") else None
      MAX_RECORDS = int(os.environ.get("MAX_RECORDS") or 0)
      TEST_MODE = START_AFTER_ID is not None or MAX_RECORDS > 0
      PAGES_DIR = pathlib.Path("pages")
      PAGES_DIR.mkdir(exist_ok=True)
      USER_AGENT = "nfip-flood-claims-pipeline (data engineering portfolio project)"
      RETRY_WAITS = [5, 15]  # short retries for transient network errors
      PAUSE_BETWEEN_PAGES = 1.0

      con = duckdb.connect()
      session = None


      def http_get(url):
          """GET with a couple of quick retries, opening a fresh connection after each failure."""
          global session
          for attempt in range(len(RETRY_WAITS) + 1):
              try:
                  if session is None:
                      session = requests.Session()
                      session.headers["User-Agent"] = USER_AGENT
                  response = session.get(url, timeout=180)
                  response.raise_for_status()
                  _ = response.content  # force the full body to be read inside the try
                  return response
              except requests.RequestException as error:
                  if session is not None:
                      session.close()
                  session = None
                  if attempt == len(RETRY_WAITS):
                      raise
                  time.sleep(RETRY_WAITS[attempt])


      def id_filter(last_id):
          if last_id is None:
              return ""
          key = f"'{last_id}'" if isinstance(last_id, str) else last_id
          return f"&$filter=id%20gt%20{key}"


      def fetch_parquet_page(last_id, size, path):
          """Next `size` rows after last_id as Parquet; validated by reading it back."""
          url = f"{API_URL}?$format=parquet&$orderby=id&$top={size}{id_filter(last_id)}"
          content = http_get(url).content
          if len(content) < 12:  # empty body: no rows left
              return 0, None
          path.write_bytes(content)
          return con.execute(f"SELECT count(*), max(id) FROM '{path}'").fetchone()


      def fetch_json_record(last_id, path):
          """Next single row after last_id as JSON (fallback for rows the API can't serve as Parquet)."""
          url = f"{API_URL}?$orderby=id&$top=1{id_filter(last_id)}"
          records = http_get(url).json()["NfipClaims"]
          path.write_text(json.dumps(records))
          return len(records), (records[0]["id"] if records else None)


      total = http_get(f"{API_URL}?$top=1&$select=id&$count=true").json()["metadata"]["count"]
      print(f"API reports {total:,} records; downloading in pages of up to {PAGE_SIZE:,}")
      if TEST_MODE:
          print(f"TEST MODE: start after id {START_AFTER_ID}, max {MAX_RECORDS or 'all'} records")

      # Keyset pagination (id > last id seen) keeps every page equally cheap for the server.
      # Adaptive page size: some records make the API abort its Parquet response mid-stream.
      # When a page fails, the size shrinks 10x until the bad record is isolated; that single
      # record is fetched as JSON instead, then the page size grows back.
      last_id = START_AFTER_ID
      size = PAGE_SIZE
      n_files = 0
      downloaded = 0
      json_fallback_ids = []
      next_report = 250_000
      started = time.time()

      while True:
          path = PAGES_DIR / f"part_{n_files:05d}.parquet"
          try:
              rows, max_id = fetch_parquet_page(last_id, size, path)
          except Exception as error:
              if path.exists():
                  path.unlink()
              if size > 1:
                  size = max(1, size // 10)
                  print(f"Page after id {last_id} failed ({type(error).__name__}); retrying with {size:,} rows")
                  continue
              json_path = PAGES_DIR / f"fallback_{n_files:05d}.json"
              rows, max_id = fetch_json_record(last_id, json_path)
              json_fallback_ids.append(max_id)
              print(f"Record id {max_id} can't be served as Parquet by the API; fetched as JSON instead")

          if rows == 0:
              if path.exists():
                  path.unlink()
              break

          last_id = max_id
          downloaded += rows
          n_files += 1
          if MAX_RECORDS and downloaded >= MAX_RECORDS:
              break
          if downloaded >= next_report:
              print(f"{downloaded:,}/{total:,} records, last id {last_id} ({int(time.time() - started)}s)")
              next_report += 250_000
          # No early exit on a short page: keep going until the API returns an empty page,
          # so a page the server cut short (but still valid) can never end the download early.
          size = min(PAGE_SIZE, size * 10)  # grow back after a successful page
          time.sleep(PAUSE_BETWEEN_PAGES)

      print(f"Downloaded {downloaded:,} records in {n_files} files ({int(time.time() - started)}s); "
            f"JSON fallback for ids: {json_fallback_ids or 'none'}")

      # Merge: Parquet pages first (union_by_name reconciles type differences between pages),
      # then the JSON fallback rows, cast to the Parquet schema column by column.
      con.execute("""
          CREATE TABLE claims AS
          SELECT * FROM read_parquet('pages/*.parquet', union_by_name = true)
      """)
      if json_fallback_ids:
          con.execute("CREATE TABLE fallback AS SELECT * FROM read_json_auto('pages/fallback_*.json')")
          fallback_cols = {row[0] for row in con.execute("DESCRIBE fallback").fetchall()}
          select_list = ", ".join(
              f'TRY_CAST(fallback."{name}" AS {dtype})' if name in fallback_cols else "NULL"
              for name, dtype, *_ in con.execute("DESCRIBE claims").fetchall()
          )
          con.execute(f"INSERT INTO claims SELECT {select_list} FROM fallback")

      con.execute("COPY claims TO 'claims.parquet' (FORMAT parquet, COMPRESSION zstd)")
      rows, distinct_ids = con.execute("SELECT count(*), count(DISTINCT id) FROM claims").fetchone()
      print(f"Merged {rows:,} rows ({distinct_ids:,} distinct ids) into claims.parquet")

      # Data quality gates: complete and without duplicates
      if distinct_ids != rows:
          raise SystemExit(f"Duplicate ids found: {rows - distinct_ids:,}")
      if TEST_MODE:
          print("TEST MODE: completeness check skipped; GCS upload and BigQuery load will be skipped")
      elif rows != total:
          raise SystemExit(f"Row count mismatch: API reported {total:,}, merged {rows:,}")

  - id: upload_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    runIf: "{{ inputs.max_records == 0 and inputs.start_after_id is null }}"
    projectId: "{{ envs.project_id }}"
    from: "{{ outputs.extract.outputFiles['claims.parquet'] }}"
    to: "{{ render(vars.gcs_uri) }}"

  - id: load_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    runIf: "{{ inputs.max_records == 0 and inputs.start_after_id is null }}"
    projectId: "{{ envs.project_id }}"
    location: "{{ envs.region }}"
    from:
      - "{{ render(vars.gcs_uri) }}"
    destinationTable: "{{ envs.project_id }}.nfip_raw.claims"
    format: PARQUET
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_TRUNCATE

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    # 06:00 UTC on the 5th of every month (OpenFEMA refreshes NFIP data roughly monthly)
    cron: "0 6 5 * *"
